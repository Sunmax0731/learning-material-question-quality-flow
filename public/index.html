<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教材取り込み・問題化・品質チェックフロー</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <p>EducationLearning / Rank 88</p>
    <h1>教材取り込み・問題化・品質チェックフロー</h1>
    <p>教材取り込み、タグ検索、問題化、暗記カード生成、テンプレ管理、教材品質チェック、ノードフローを一連化する。</p>
  </header>
  <main id="closed-alpha-preview">
    <section>
      <h2>Closed Alpha Focus</h2>
      <p>読む、問題化、品質確認、復習化を小さな再実行可能フローとして保存する。</p>
    </section>
    <section>
      <h2>Required Fields</h2>
      <ul>
<li><code>id</code></li>
<li><code>title</code></li>
<li><code>materialSource</code></li>
<li><code>questionType</code></li>
<li><code>qualityRule</code></li>
<li><code>reviewOwner</code></li>
      </ul>
    </section>
    <section id="app"></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
